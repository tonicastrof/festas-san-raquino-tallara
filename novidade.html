<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novidade – San Roquiño</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── NAVBAR ── -->
  <header class="navbar" id="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">
        <img class="nav-logo-icon" src="img/logoweb.jpg" alt="San Roquiño">
        <span class="nav-logo-text">San Roquiño</span>
      </a>

      <nav class="nav-links" id="navLinks">
        <a href="index.html#novidades" data-i18n="nav_novidades">Novidades</a>
        <a href="index.html#actividades" data-i18n="nav_actividades">Actividades</a>
        <a href="index.html#festas" data-i18n="nav_festas">Festas</a>
        <a href="index.html#patrocinadores" data-i18n="nav_patrocinadores">Patrocinadores</a>
        <a href="index.html#localizacion" data-i18n="nav_localizacion">Localización</a>
        <a href="index.html#contacto" data-i18n="nav_contacto">Contacto</a>
      </nav>

      <div class="nav-actions">
        <button class="lang-btn" id="langToggle" aria-label="Cambiar idioma">ES</button>
        <button class="nav-burger" id="navBurger" aria-label="Menú" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ── DETAIL CONTENT ── -->
  <main class="detail-page" id="detailPage">
    <!-- Rendered by JS -->
  </main>

  <!-- ── FOOTER ── -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-brand">
        <img class="footer-logo-icon" src="img/logoweb.jpg" alt="San Roquiño">
        <p class="footer-name" data-i18n="footer_name">Comisión de Festas de San Roquiño de Tállara</p>
        <p class="footer-location">Tállara · Lousame · A Coruña</p>
      </div>
      <p class="footer-copy" id="footerCopy"></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    /* ── Mobile nav ── */
    const burger   = document.getElementById('navBurger');
    const navLinks = document.getElementById('navLinks');

    burger.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('open');
      burger.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', isOpen);
    });

    navLinks.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        navLinks.classList.remove('open');
        burger.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });

    /* ── Render novidade detail ── */
    function renderDetail() {
      const id   = window.location.hash.slice(1);
      const page = document.getElementById('detailPage');
      const copy = document.getElementById('footerCopy');

      if (copy) copy.textContent = '© ' + new Date().getFullYear() + ' Comisión de Festas de San Roquiño de Tállara';

      const nov = DATA.novidades.find(n => n.slug === id);
      if (!nov) {
        page.innerHTML = `
          <div class="detail-hero">
            <div class="container detail-hero-content">
              <a href="index.html" class="detail-back">&larr; ${T[lang].detail_back}</a>
              <h1 class="detail-title">${lang === 'gl' ? 'Novidade non atopada' : 'Novedad no encontrada'}</h1>
            </div>
          </div>`;
        return;
      }

      const d = nov[lang];
      const det = d.detail;
      document.title = d.title + ' – San Roquiño';

      // ── Info cards ──
      let infoCardsHtml = '';
      if (det.infoCards) {
        infoCardsHtml = `<div class="nd-sections-grid act-info-grid">` +
          det.infoCards.map(c => `
            <div class="act-info-card">
              <span class="act-info-icon">${c.icon}</span>
              <p class="act-info-label">${c.label}</p>
              <p class="act-info-value">${c.value}</p>
            </div>`).join('') +
        `</div>`;
      }

      // ── Sections – each section can have its own icon or fall back to defaults ──
      const sectionIconsFallback = ['🎨','🗳️','📅','📌','✨','🔔'];
      let sectionsHtml = '';
      if (det.sections) {
        sectionsHtml = `<div class="nd-sections-grid">` +
          det.sections.map((s, i) => `
            <div class="nd-section-card">
              <span class="nd-section-icon">${s.icon || sectionIconsFallback[i] || '📌'}</span>
              <h3 class="nd-section-title">${s.title}</h3>
              <p class="nd-section-text">${s.content}</p>
            </div>
          `).join('') +
        `</div>`;
      }

      // ── Requisitos ──
      let requisitosHtml = '';
      if (det.requisitos) {
        requisitosHtml = `
          <div class="nd-block">
            <div class="nd-block-header">
              <span class="nd-block-icon">📋</span>
              <h3 class="nd-block-title">${det.requisitos_title}</h3>
            </div>
            <ul class="nd-checklist">
              ${det.requisitos.map(r => `
                <li>
                  <span class="nd-check">✓</span>
                  <span>${r}</span>
                </li>`).join('')}
            </ul>
          </div>`;
      }

      // ── Onde entregar ──
      const entregaIcons = ['👥','🏪','✂️','💻'];
      let entregaHtml = '';
      if (det.entrega) {
        entregaHtml = `
          <div class="nd-block nd-block-dark">
            <div class="nd-block-header">
              <span class="nd-block-icon">📬</span>
              <h3 class="nd-block-title">${det.entrega_title}</h3>
            </div>
            <div class="nd-entrega-grid">
              ${det.entrega.map((e, i) => `
                <div class="nd-entrega-card">
                  <span class="nd-entrega-icon">${entregaIcons[i] || '📍'}</span>
                  <p>${e}</p>
                </div>`).join('')}
            </div>
          </div>`;
      }

      // ── Form ──
      let formHtml = '';
      if (nov.hasForm) {
        formHtml = `
          <div class="form-section">
            <div class="form-header">
              <h3 class="detail-section-title">${T[lang].form_title}</h3>
              <p class="form-subtitle">${T[lang].form_subtitle}</p>
            </div>
            <form id="debuxoForm" class="debuxo-form" novalidate>
              <div class="form-group">
                <label for="formName">${T[lang].form_name} *</label>
                <input type="text" id="formName" name="name" required autocomplete="name">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="formPhone">${T[lang].form_phone} *</label>
                  <input type="tel" id="formPhone" name="phone" required autocomplete="tel">
                </div>
                <div class="form-group">
                  <label for="formEmail">${T[lang].form_email} *</label>
                  <input type="email" id="formEmail" name="email" required autocomplete="email">
                </div>
              </div>
              <div class="form-group">
                <label for="formFile">${T[lang].form_file} *</label>
                <div class="file-upload" id="fileUploadArea">
                  <input type="file" id="formFile" name="debuxo" accept="image/*,.pdf" required>
                  <div class="file-upload-content">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span class="file-upload-label" id="fileLabel">${T[lang].form_file_help}</span>
                  </div>
                </div>
              </div>
              <div class="form-message" id="formMessage"></div>
              <button type="submit" class="btn btn-ouro form-submit">${T[lang].form_submit}</button>
            </form>
          </div>`;
      }

      page.innerHTML = `
        <div class="detail-hero">
          <div class="container detail-hero-content">
            <a href="index.html#novidades" class="detail-back">&larr; ${T[lang].detail_back}</a>
            <p class="detail-season">${d.date}</p>
            <h1 class="detail-title">${d.title}</h1>
            <div class="detail-title-line"></div>
          </div>
        </div>
        <div class="container nd-body">
          <div class="nd-intro-band">
            <p class="nd-intro-text">${det.intro}</p>
          </div>
          ${infoCardsHtml}
          ${sectionsHtml}
          ${requisitosHtml}
          ${entregaHtml}
          ${formHtml}
          <div id="inscripcion-online"></div>
          ${nov.hasRutaForm ? '<div id="ruta-form-container"></div>' : ''}
          ${det.closing ? `
            <div class="nd-closing">
              <span class="nd-closing-icon">🌈</span>
              <p>${det.closing}</p>
            </div>` : ''}
          <a href="index.html#novidades" class="btn btn-outline detail-cta">&larr; ${T[lang].detail_back}</a>
        </div>`;

      if (nov.hasForm) initForm();
      if (nov.eventoSlug && typeof checkAndRenderInscripcion === 'function') {
        checkAndRenderInscripcion(nov.eventoSlug, lang);
      }
      if (nov.hasRutaForm) initRutaForm(lang);
    }

    function initForm() {
      const form = document.getElementById('debuxoForm');
      const fileInput = document.getElementById('formFile');
      const fileLabel = document.getElementById('fileLabel');
      const msg = document.getElementById('formMessage');
      if (!form) return;

      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          const f = fileInput.files[0];
          const sizeMB = (f.size / 1024 / 1024).toFixed(1);
          fileLabel.textContent = f.name + ' (' + sizeMB + ' MB)';
          fileLabel.closest('.file-upload').classList.add('has-file');
        } else {
          fileLabel.textContent = T[lang].form_file_help;
          fileLabel.closest('.file-upload').classList.remove('has-file');
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        msg.className = 'form-message';

        const name  = form.name.value.trim();
        const phone = form.phone.value.trim();
        const email = form.email.value.trim();
        const file  = fileInput.files[0];

        if (!name || !phone || !email || !file) {
          msg.textContent = T[lang].form_required;
          msg.classList.add('form-message-error');
          return;
        }

        if (file.size > 10 * 1024 * 1024) {
          msg.textContent = lang === 'gl'
            ? 'O arquivo é demasiado grande. Máximo 10 MB.'
            : 'El archivo es demasiado grande. Máximo 10 MB.';
          msg.classList.add('form-message-error');
          return;
        }

        const btn = form.querySelector('.form-submit');
        btn.disabled = true;
        btn.textContent = lang === 'gl' ? 'Enviando…' : 'Enviando…';

        const ext = file.name.split('.').pop();
        const path = `${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;

        const { error: uploadErr } = await sb
          .storage.from('debuxos').upload(path, file, {
            contentType: file.type,
            upsert: false,
          });

        if (uploadErr) {
          console.error('Upload error:', uploadErr);
          msg.textContent = T[lang].form_error;
          msg.classList.add('form-message-error');
          btn.disabled = false;
          btn.textContent = T[lang].form_submit;
          return;
        }

        const { data: urlData } = sb.storage.from('debuxos').getPublicUrl(path);

        const { error: dbErr } = await sb.from('debuxos').insert([{
          nome: name,
          telefono: phone,
          email: email,
          arquivo_url: urlData.publicUrl,
        }]);

        if (dbErr) {
          msg.textContent = T[lang].form_error;
          msg.classList.add('form-message-error');
          btn.disabled = false;
          btn.textContent = T[lang].form_submit;
          return;
        }

        msg.textContent = T[lang].form_success;
        msg.classList.add('form-message-success');
        form.reset();
        fileLabel.textContent = T[lang].form_file_help;
        fileLabel.closest('.file-upload').classList.remove('has-file');
        btn.disabled = false;
        btn.textContent = T[lang].form_submit;
      });
    }

    /* ── Ruta Nocturna — formulario de inscrición ── */
    function initRutaForm(lg) {
      const container = document.getElementById('ruta-form-container');
      if (!container) return;
      const t = T[lg];
      const isOpen = DATA.ruta_inscripcions_open;
      const precio = DATA.ruta_precio_persona || 10;
      const iban   = DATA.ruta_iban || '';

      // Check section (always visible)
      const checkHtml = `
        <div class="ruta-check-section">
          <h3>${t.ruta_check_title}</h3>
          <p>${t.ruta_check_sub}</p>
          <div class="ruta-check-row">
            <input type="text" id="rutaCheckInput" placeholder="${t.ruta_check_placeholder}">
            <button class="btn btn-ouro btn-sm" id="rutaCheckBtn">${t.ruta_check_btn}</button>
          </div>
          <div class="ruta-check-result" id="rutaCheckResult"></div>
        </div>`;

      if (!isOpen) {
        container.innerHTML = `
          <div class="ruta-closed-banner"><span>🔒</span>${t.ruta_closed}</div>
          ${checkHtml}`;
        initRutaCheck(lg);
        return;
      }

      container.innerHTML = `
        <div class="ruta-form-section" id="rutaFormSection">
          <div class="ruta-form-header">
            <h3>${t.ruta_form_title}</h3>
            <p>${t.ruta_form_sub}</p>
          </div>
          <form id="rutaForm" novalidate>
            <div id="rutaParticipants"></div>
            <button type="button" class="ruta-add-btn" id="rutaAddBtn">${t.ruta_add_person}</button>
            <div class="ruta-total-bar">
              <span class="ruta-total-label">${t.ruta_total}</span>
              <span class="ruta-total-value" id="rutaTotal">${precio} €</span>
            </div>
            <div class="ruta-form-msg" id="rutaFormMsg"></div>
            <button type="submit" class="btn btn-ouro">${t.ruta_submit}</button>
          </form>
        </div>
        ${checkHtml}`;

      let count = 0;

      function addParticipant() {
        count++;
        const card = document.createElement('div');
        card.className = 'ruta-participant-card';
        card.dataset.idx = count;
        card.innerHTML = `
          <div class="ruta-participant-label">
            <span>${t.ruta_persona} ${count}</span>
            ${count > 1 ? `<button type="button" class="ruta-remove-btn" data-remove="${count}">${t.ruta_remove}</button>` : ''}
          </div>
          <div class="ruta-fields-grid">
            <div class="ruta-field">
              <label>${t.ruta_nome} *</label>
              <input type="text" data-field="nome" required>
            </div>
            <div class="ruta-field">
              <label>${t.ruta_apelidos} *</label>
              <input type="text" data-field="apelidos" required>
            </div>
            <div class="ruta-field">
              <label>${t.ruta_dni} *</label>
              <input type="text" data-field="dni" required>
            </div>
            <div class="ruta-field">
              <label>${t.ruta_telefono} *</label>
              <input type="tel" data-field="telefono" required>
            </div>
          </div>`;
        document.getElementById('rutaParticipants').appendChild(card);

        const rmBtn = card.querySelector('.ruta-remove-btn');
        if (rmBtn) rmBtn.addEventListener('click', () => { card.remove(); updateTotal(); renumber(); });
        updateTotal();
      }

      function updateTotal() {
        const n = document.querySelectorAll('.ruta-participant-card').length;
        document.getElementById('rutaTotal').textContent = (n * precio) + ' €';
      }

      function renumber() {
        document.querySelectorAll('.ruta-participant-card').forEach((c, i) => {
          c.querySelector('.ruta-participant-label span').textContent = t.ruta_persona + ' ' + (i + 1);
        });
      }

      addParticipant();
      document.getElementById('rutaAddBtn').addEventListener('click', addParticipant);

      document.getElementById('rutaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('rutaFormMsg');
        msg.className = 'ruta-form-msg';
        msg.textContent = '';

        const cards = document.querySelectorAll('.ruta-participant-card');
        const participantes = [];
        let valid = true;

        cards.forEach(c => {
          const p = {};
          c.querySelectorAll('input[data-field]').forEach(inp => {
            p[inp.dataset.field] = inp.value.trim();
            if (!p[inp.dataset.field]) valid = false;
          });
          participantes.push(p);
        });

        if (!valid || !participantes.length) {
          msg.className = 'ruta-form-msg ruta-form-msg-error';
          msg.textContent = t.ruta_required;
          return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = t.ruta_sending;

        const tel = participantes[0].telefono;
        const { data, error } = await submitRutaInscripcion(participantes, tel, null);

        if (error) {
          msg.className = 'ruta-form-msg ruta-form-msg-error';
          msg.textContent = t.ruta_required;
          btn.disabled = false;
          btn.textContent = t.ruta_submit;
          return;
        }

        showRutaSuccess(data, lg);
      });

      initRutaCheck(lg);
    }

    function showRutaSuccess(data, lg) {
      const t = T[lg];
      const section = document.getElementById('rutaFormSection');
      section.innerHTML = `
        <div class="ruta-success-card">
          <div class="ruta-success-icon">✓</div>
          <h3>${t.ruta_success_title}</h3>
          <p style="margin-bottom:0.5rem">${t.ruta_success_code}</p>
          <div class="ruta-code-display">${data.codigo}</div>
          <div class="ruta-info-row">
            <span class="ruta-info-label">${t.ruta_success_amount}</span>
            <span class="ruta-info-value">${data.total_euros} €</span>
          </div>
          <div class="ruta-info-row">
            <span class="ruta-info-label">${t.ruta_success_iban}</span>
            <span class="ruta-iban-display">${DATA.ruta_iban}</span>
            <span class="ruta-iban-note">${t.ruta_success_iban_note}</span>
          </div>
          <div class="ruta-upload-section">
            <label>${t.ruta_upload_label}</label>
            <div class="ruta-upload-row">
              <div class="file-upload" style="flex:1;min-width:200px">
                <input type="file" id="rutaComprobanteFile" accept=".pdf">
                <div class="file-upload-content">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                  <span class="file-upload-label" id="rutaFileLabel">${t.ruta_upload_help}</span>
                </div>
              </div>
              <button class="btn btn-ouro btn-sm" id="rutaUploadBtn">${t.ruta_upload_btn}</button>
            </div>
            <div class="ruta-upload-msg" id="rutaUploadMsg"></div>
          </div>
        </div>`;

      const fileInput = document.getElementById('rutaComprobanteFile');
      const fileLabel = document.getElementById('rutaFileLabel');

      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) {
          const f = fileInput.files[0];
          fileLabel.textContent = f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
          fileLabel.closest('.file-upload').classList.add('has-file');
        } else {
          fileLabel.textContent = t.ruta_upload_help;
          fileLabel.closest('.file-upload').classList.remove('has-file');
        }
      });

      document.getElementById('rutaUploadBtn').addEventListener('click', async () => {
        const btn = document.getElementById('rutaUploadBtn');
        const msg = document.getElementById('rutaUploadMsg');
        const file = fileInput.files[0];
        if (!file) return;

        if (file.size > 10 * 1024 * 1024) {
          msg.className = 'ruta-upload-msg ruta-upload-msg-err';
          msg.textContent = lg === 'gl' ? 'O arquivo é demasiado grande (máx. 10 MB).' : 'El archivo es demasiado grande (máx. 10 MB).';
          return;
        }

        btn.disabled = true;
        btn.textContent = lg === 'gl' ? 'Enviando...' : 'Enviando...';
        msg.className = 'ruta-upload-msg';
        msg.textContent = '';

        const { error } = await uploadRutaComprobante(data.id, data.codigo, file);

        if (error) {
          msg.className = 'ruta-upload-msg ruta-upload-msg-err';
          msg.textContent = t.ruta_upload_error;
          btn.disabled = false;
          btn.textContent = t.ruta_upload_btn;
        } else {
          msg.className = 'ruta-upload-msg ruta-upload-msg-ok';
          msg.textContent = t.ruta_upload_success;
          btn.style.display = 'none';
        }
      });
    }

    function initRutaCheck(lg) {
      const t = T[lg];
      const btn = document.getElementById('rutaCheckBtn');
      const input = document.getElementById('rutaCheckInput');
      if (!btn || !input) return;

      async function doCheck() {
        const q = input.value.trim();
        if (!q) return;
        const result = document.getElementById('rutaCheckResult');
        btn.disabled = true;
        btn.textContent = '...';

        const { data } = await lookupRutaInscripcion(q);

        btn.disabled = false;
        btn.textContent = t.ruta_check_btn;

        if (!data) {
          result.innerHTML = `<p style="color:#b91c1c;font-size:0.9rem;margin-top:0.75rem">${t.ruta_check_not_found}</p>`;
          return;
        }

        const statusKey = 'ruta_status_' + data.estado;
        const statusText = t[statusKey] || data.estado;
        const badgeClass = 'ruta-badge-' + data.estado;
        const partList = (data.participantes || []).map(p => `<li>${p.nome} ${p.apelidos} — ${p.dni}</li>`).join('');

        result.innerHTML = `
          <div class="ruta-status-card" style="margin-top:0.75rem">
            <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
              <span class="ruta-status-badge ${badgeClass}">${statusText}</span>
            </div>
            <div class="ruta-info-row">
              <span class="ruta-info-label">${t.ruta_status_code}</span>
              <span class="ruta-info-value">${data.codigo}</span>
            </div>
            <div class="ruta-info-row">
              <span class="ruta-info-label">${t.ruta_status_amount}</span>
              <span class="ruta-info-value">${data.total_euros} €</span>
            </div>
            <div class="ruta-info-row">
              <span class="ruta-info-label">${t.ruta_status_people} (${data.total_persoas})</span>
              <ul style="margin:0;padding-left:1.25rem;font-size:0.9rem;color:var(--escuro)">${partList}</ul>
            </div>
            ${data.estado === 'pendente_pago' && DATA.ruta_inscripcions_open ? `
              <div style="margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--gris-claro)">
                <p style="font-size:0.85rem;color:var(--gris);margin-bottom:0.5rem">${t.ruta_success_iban}</p>
                <span class="ruta-iban-display">${DATA.ruta_iban}</span>
              </div>` : ''}
          </div>`;
      }

      btn.addEventListener('click', doCheck);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doCheck(); } });
    }

    renderDetail();
    applyLang();

    document.getElementById('langToggle').addEventListener('click', () => {
      lang = lang === 'gl' ? 'es' : 'gl';
      localStorage.setItem('sr-lang', lang);
      applyLang();
      renderDetail();
    });
  </script>
</body>
</html>
